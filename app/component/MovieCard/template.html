<div class="movieCard-wrapper">
  <div class="movieCard-container" onclick="C.handlerDetail('{{id}}')">
    <div class="movieCard__img-container">
      <img class="movieCard__img" src="{{image}}" alt="image de film" />
    </div>
    <div class="movieCard__title-container">
      <h2 class="movieCard__title">{{name}}</h2>
    </div>
  </div>
  
  <button class="btn-cyan" onclick="C.handlerAddFavorite('{{id}}')">▶ AJOUTER AUX FAVORIS</button>
</div>
