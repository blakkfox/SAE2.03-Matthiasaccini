<section class="stats-container">
  <h2 class="category__title">Statistiques de la plateforme</h2>
  
  <div class="stats-grid">
    <div class="stat-card">
      <h3 class="stat-card__title">Profils créés</h3>
      <p class="stat-card__value">{{totalProfiles}}</p>
    </div>
    
    <div class="stat-card">
      <h3 class="stat-card__title">Moyenne de favoris/profil</h3>
      <p class="stat-card__value">{{avgFavs}}</p>
    </div>
    
    <div class="stat-card">
      <h3 class="stat-card__title">Films dans la base</h3>
      <p class="stat-card__value">{{totalMovies}}</p>
    </div>
    
    <div class="stat-card">
      <h3 class="stat-card__title">Film le plus aimé</h3>
      <p class="stat-card__value">{{topMovie}}</p>
    </div>
    
    <div class="stat-card">
      <h3 class="stat-card__title">Catégorie préférée</h3>
      <p class="stat-card__value">{{topCategory}}</p>
    </div>
  </div>
</section>
