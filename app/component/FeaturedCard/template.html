<div class="featuredCard-container" onclick="C.handlerDetail('{{id}}')">
  <div class="featuredCard__info">
    <h3 class="featuredCard__title">{{name}}</h3>
    <p class="featuredCard__desc">{{description}}</p>
  </div>
  <div class="featuredCard__image-wrapper">
    <img src="../server/images/{{image}}" alt="{{name}}" class="featuredCard__image"/>
  </div>
</div>
