<!doctype html>
<html lang="fr">
  <head>
    <title>SAE2.03 APP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
  </head>

  <body>
    <header id="header"></header>
    <section id="content"></section>

    <script type="module">
      import { DataMovie } from "./data/dataMovie.js";
      import { DataCategory } from "./data/dataCategory.js";
      import { DataProfile } from "./data/dataProfile.js";

      import { NavBar } from "./component/NavBar/script.js";
      import { Movie } from "./component/Movie/script.js";
      import { Detail } from "./component/Detail/script.js";
      import { MovieCategory } from "./component/Category/script.js";

      let dataMovies = await DataMovie.requestMovies(0);
      let dataCategories = await DataCategory.requestCategories();
      let dataProfiles = await DataProfile.read();

      const categoryNames = {};
      for(let cat of dataCategories) {
        categoryNames[cat.id] = cat.name;
      }

      window.C = {};

      C.handlerAbout = function () {
        alert(
          "Ceci est une base de projet pour la SAE2.03 édition 2025. Bonne chance !",
        );
      };
      
      C.handlerDetail = async function (id) {
        let movieData = await DataMovie.requestDetails(id);
        let html = Detail.format(movieData);
        let zonePrincipale = document.querySelector("#content");
        zonePrincipale.innerHTML = html;
      };

      C.handlerHome = function () {
        C.handlerChangeProfile()
      }

      C.handlerChangeProfile = async function () {
        let select = document.querySelector("#profile-select");
        window.currentProfileId = select.value;
        
        let ageLimite = 0;
        
        if (window.currentProfileId !== "") {
          let selectedProfile = dataProfiles.find(p => p.id == window.currentProfileId);
          if (selectedProfile) {
            ageLimite = selectedProfile.min_age;
          }
        }

        let moviesFiltres = await DataMovie.requestMovies(ageLimite);
        
        V.renderCategories(moviesFiltres);
      };

      C.start = function () {
        V.renderNavBar("C.handlerAbout()", "C.handlerHome()", "C.handlerChangeProfile()", dataProfiles);
        V.renderCategories(dataMovies); 
      };

      window.V = {};

      V.renderNavBar = function (hAbout, hHome, hProfileChange, profiles) {
        let header = document.querySelector("#header");
        header.innerHTML = NavBar.format(hAbout, hHome, hProfileChange, profiles, window.currentProfileId);
      };
      
      V.renderMovie = function (data, css = "") {
        let movie = document.querySelector("#content");
        movie.innerHTML = Movie.format(data, css);
      };
      
      V.renderDetail = function (hDetail, css = "") {
        let detail = document.querySelector("#content");
        detail.innerHTML = Detail.format(hDetail, css);
      };
      
      V.renderCategories = function (movies) {
        let content = document.querySelector("#content");

        if (movies.length === 0) {
          content.innerHTML = "<h3 style='margin: 3rem; text-align: center; color: var(--color-fg);'>Aucun film disponible pour votre tranche d'âge.</h3>";
          return;
        }
        
        let moviesByCategory = {};
        for (let i = 0; i < movies.length; i++) {
          let movie = movies[i];
          let catId = movie.id_category;
          
          if (moviesByCategory[catId] === undefined) {
            moviesByCategory[catId] = [];
          }
          moviesByCategory[catId].push(movie);
        }

        let htmlFinal = "";
        
        for (let catId in moviesByCategory) {
          let categoryName = categoryNames[catId] || "Autre"; 
          let categoryMovies = moviesByCategory[catId];
          
          htmlFinal += MovieCategory.format(categoryName, categoryMovies);
        }

        content.innerHTML = htmlFinal;
      };

      C.start();
    </script>
  </body>
</html>
