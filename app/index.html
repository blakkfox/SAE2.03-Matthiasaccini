<!doctype html>
<html lang="fr">
  <head>
    <title>SAE2.03 APP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
  </head>

  <body>
    <header id="header"></header>
    <section id="content"></section>

    <script type="module">
      import { DataMovie } from "./data/dataMovie.js";
      import { DataCategory } from "./data/dataCategory.js";
      import { DataProfile } from "./data/dataProfile.js";
      import { DataFavorite } from "./data/dataFavorite.js";
      import { DataStats } from "./data/dataStats.js";

      import { NavBar } from "./component/NavBar/script.js";
      import { Movie } from "./component/Movie/script.js";
      import { MovieCard } from "./component/MovieCard/script.js";
      import { Detail } from "./component/Detail/script.js";
      import { MovieCategory } from "./component/Category/script.js";
      import { FavoriteCard } from "./component/FavoriteCard/script.js";
      import { FeaturedCard } from "./component/FeaturedCard/script.js";
      import { Stats } from "./component/Stats/script.js";

      let dataMovies = await DataMovie.requestMovies(0);
      let dataCategories = await DataCategory.requestCategories();
      let dataProfiles = await DataProfile.read();

      const categoryNames = {};
      for (let cat of dataCategories) {
        categoryNames[cat.id] = cat.name;
      }

      window.C = {};

      C.handlerAbout = function () {
        alert(
          "Ceci est une base de projet pour la SAE2.03 édition 2025. Bonne chance !",
        );
      };

      C.handlerDetail = async function (id) {
        let movieData = await DataMovie.requestDetails(id);
        let html = Detail.format(movieData);
        let zonePrincipale = document.querySelector("#content");
        zonePrincipale.innerHTML = html;
      };

      C.handlerHome = function () {
        C.handlerChangeProfile();
      };

      C.handlerChangeProfile = async function () {
        let select = document.querySelector("#profile-select");
        window.currentProfileId = select.value;
        let ageLimite = 0;

        if (window.currentProfileId !== "") {
          let selectedProfile = dataProfiles.find(
            (p) => p.id == window.currentProfileId,
          );
          if (selectedProfile) {
            ageLimite = selectedProfile.min_age;
          }
        }

        let moviesFiltres = await DataMovie.requestMovies(ageLimite);
        let featuredFiltres = await DataMovie.requestFeatured(ageLimite);

        V.renderCategories(moviesFiltres, featuredFiltres);
      };

      C.handlerAddFavorite = async function (id_movie) {
        if (window.currentProfileId == null || window.currentProfileId === "") {
          alert("Veuillez d'abord sélectionner un profil en haut !");
          return;
        }
        let res = await DataFavorite.add(window.currentProfileId, id_movie);
        alert(res.message);
      };

      C.handlerShowFavorites = async function () {
        if (window.currentProfileId == null || window.currentProfileId === "") {
          alert("Veuillez sélectionner un profil pour voir vos favoris.");
        } else {
          let favoriteMovies = await DataFavorite.readMovies(
            window.currentProfileId,
          );
          V.renderFavorites(favoriteMovies);
        }
      };

      C.handlerRemoveFavorite = async function (id_movie) {
        let res = await DataFavorite.remove(window.currentProfileId, id_movie);
        alert(res.message);
        if (res.success) {
          await C.handlerShowFavorites();
        }
      };

      C.handlerShowStats = async function () {
        let statsData = await DataStats.read();
        V.renderStats(statsData);
      };

      C.handlerSearch = async function (keyword) {
        if (keyword.trim() === "") {
          await C.handlerChangeProfile();
          return;
        }

        let ageLimite = 0;
        if (window.currentProfileId && window.currentProfileId !== "") {
          let selectedProfile = dataProfiles.find(
            (p) => p.id == window.currentProfileId,
          );
          if (selectedProfile) {
            ageLimite = selectedProfile.min_age;
          }
        }

        let searchResults = await DataMovie.search(keyword, ageLimite);

        V.renderSearch(searchResults, keyword);
      };

      C.start = async function () {
        let featuredInitial = await DataMovie.requestFeatured(0);

        V.renderNavBar(
          "C.handlerAbout()",
          "C.handlerHome()",
          "C.handlerShowFavorites()",
          "C.handlerShowStats()",
          "C.handlerSearch(this.value)",
          "C.handlerChangeProfile()",
          dataProfiles,
        );

        V.renderCategories(dataMovies, featuredInitial);
      };

      window.V = {};

      V.renderNavBar = function (hAbout, hHome, hFavorites, hStats, hSearch, hProfileChange, profiles) {
        let header = document.querySelector("#header");

        header.innerHTML = NavBar.format(hAbout, hHome, hFavorites, hStats, hSearch, hProfileChange, profiles, window.currentProfileId);
      };

      V.renderMovie = function (data, css = "") {
        let movie = document.querySelector("#content");
        movie.innerHTML = Movie.format(data, css);
      };

      V.renderDetail = function (hDetail, css = "") {
        let detail = document.querySelector("#content");
        detail.innerHTML = Detail.format(hDetail, css);
      };

      V.renderCategories = function (movies, featuredMovies) {
        let content = document.querySelector("#content");
        let htmlFinal = "";

        htmlFinal += "<section class='featured-section'>";
        htmlFinal += "<h2 class='category__title'>Films mis en avant</h2>";

        if (!featuredMovies || featuredMovies.length === 0) {
          htmlFinal +=
            "<p class='msg-empty'>Aucun film mis en avant pour le moment.</p>";
        } else {
          htmlFinal += "<div class='featured-grid'>";
          for (let m of featuredMovies) {
            htmlFinal += FeaturedCard.format(m);
          }
          htmlFinal += "</div>";
        }
        htmlFinal += "</section>";

        if (movies.length === 0) {
          htmlFinal +=
            "<h3 class='msg-empty'>Aucun film disponible pour votre tranche d'âge.</h3>";
        } else {
          let moviesByCategory = {};
          for (let i = 0; i < movies.length; i++) {
            let movie = movies[i];
            let catId = movie.id_category;
            if (moviesByCategory[catId] === undefined) {
              moviesByCategory[catId] = [];
            }
            moviesByCategory[catId].push(movie);
          }

          for (let catId in moviesByCategory) {
            let categoryName = categoryNames[catId] || "Autre";
            let categoryMovies = moviesByCategory[catId];

            let htmlCartes = "";
            for (let m of categoryMovies) {
              htmlCartes += MovieCard.format(m);
            }

            htmlFinal += `<section class="category-container">
                            <h2 class="category__title">${categoryName}</h2>
                            <div class="category__content" style="display:flex; flex-wrap:wrap; gap:1rem;">
                              ${htmlCartes}
                            </div>
                          </section>`;
          }
        }
        content.innerHTML = htmlFinal;
      };

      V.renderFavorites = function (movies) {
        let content = document.querySelector("#content");

        if (movies.length === 0) {
          content.innerHTML =
            "<h3 class='msg-empty'>Votre liste de favoris est vide.</h3>";
        } else {
          let htmlFinal = "<h2 class='category__title'>Mes Favoris</h2>";
          htmlFinal += "<div class='favorites-grid'>";

          for (let i = 0; i < movies.length; i++) {
            htmlFinal += FavoriteCard.format(movies[i]);
          }

          htmlFinal += "</div>";
          content.innerHTML = htmlFinal;
        }
      };

      V.renderStats = function (statsData) {
        let content = document.querySelector("#content");
        content.innerHTML = Stats.format(statsData);
      };

      V.renderSearch = function (movies, keyword) {
        let content = document.querySelector("#content");
        let htmlFinal = `<h2 class="category__title">Résultats pour "${keyword}"</h2>`;

        if (movies.length === 0) {
          htmlFinal += `<h3 class="msg-empty">Aucun film ne correspond à votre recherche.</h3>`;
        } else {
          htmlFinal += `<div class="favorites-grid">`;
          for (let m of movies) {
            htmlFinal += MovieCard.format(m);
          }
          htmlFinal += `</div>`;
        }

        content.innerHTML = htmlFinal;
      };

      C.start();
    </script>
  </body>
</html>
