<div class="profile-form-container">
  <h2>Ajouter un nouveau profil</h2>

  <form class="add-profile-form" onsubmit="event.preventDefault(); {{handler}}">
    <div class="form-group">
      <label for="nameProfile">Nom du profil *</label>
      <input type="text" id="nameProfile" name="name" required />
    </div>

    <div class="form-group">
      <label for="avatarProfile">Nom de l'image (Avatar)</label>
      <input type="text" id="avatarProfile" name="avatar" placeholder="ex: avatar1.png" />
    </div>

    <div class="form-group">
      <label for="min_ageProfile">Restriction d'âge *</label>
      <select id="min_ageProfile" name="min_age" required>
        <option value="10">10 ans et +</option>
        <option value="12">12 ans et +</option>
        <option value="16">16 ans et +</option>
        <option value="18">18 ans et +</option>
      </select>
    </div>

    <button type="submit" class="btn-submit">Créer le profil</button>
  </form>
</div>
