<!doctype html>
<html lang="fr">
  <head>
    <title>SAE2.03 ADMIN</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
  </head>
  <body>
    <section id="log"></section>
    
    <div class="admin-layout-top">
        <section id="movie-form"></section>
        <section id="profile-form"></section>
    </div>
    
    <div class="admin-layout-bottom">
        <section id="featured-form-section"></section>
    </div>

    <script type="module">
      import { Log } from "./component/Log/script.js";
      import { MovieForm } from "./component/MovieForm/script.js";
      import { ProfileForm } from "./component/ProfileForm/script.js"; 
      import { FeaturedForm } from "./component/FeaturedForm/script.js";

      import { DataMovie } from "./data/dataMovie.js";
      import { DataProfile } from "./data/dataProfile.js"; 

      window.profilesData = await DataProfile.read();
      window.C = {};

      C.start = function () {
        V.renderLog("Démarrage de l'administration");
        V.renderFormMovie("C.handlerAddMovie(event)");
        V.renderFormProfile("C.handlerSaveProfile(event)", "C.handlerSelectProfile()", window.profilesData);
        V.renderFormFeatured("C.handlerSearchFeatured(this.value)");
      };

      C.handlerAddMovie = async function () {
        let form = document.querySelector(".add-movie-form");
        let fd = new FormData(form);
        let res = await DataMovie.add(fd);
        V.renderLog(res.message);
        if (res.success) form.reset();
      };


      C.handlerSelectProfile = function () {
        let select = document.querySelector("#select-profile");
        let id = select.value;
        let form = document.querySelector(".save-profile-form");

        if (id === "") {
          form.reset();
          document.querySelector("#idProfile").value = "";
        } else {
          let profile = window.profilesData.find(p => p.id == id);
          if (profile) {
            document.querySelector("#idProfile").value = profile.id;
            document.querySelector("#nameProfile").value = profile.name;
            document.querySelector("#avatarProfile").value = profile.avatar;
            document.querySelector("#min_ageProfile").value = profile.min_age;
          }
        }
      };

      C.handlerSaveProfile = async function () {
        let form = document.querySelector(".save-profile-form");
        let fd = new FormData(form);
        let res = await DataProfile.save(fd);
        
        V.renderLog(res.message);

        if (res.success) {
          form.reset();
          document.querySelector("#idProfile").value = "";

          window.profilesData = await DataProfile.read();
          V.renderFormProfile("C.handlerSaveProfile(event)", "C.handlerSelectProfile()", window.profilesData);
        }
      };

      C.handlerSearchFeatured = async function (keyword) {
        let container = document.querySelector("#featured-results-container");

        if (keyword.trim() === "") {
          container.innerHTML = "<p class='msg-empty'>Tapez un titre pour rechercher des films...</p>";
          return;
        }

        let movies = await DataMovie.search(keyword);
        let htmlResults = "";

        if (movies.length === 0) {
          htmlResults = "<p class='msg-empty'>Aucun film ne correspond à votre recherche.</p>";
        } else {
          htmlResults = "<div class='featured-list'>";
          for (let m of movies) {
            let isFeatured = (m.featured == 1);
            let btnClass = isFeatured ? "btn-toggle-off" : "btn-toggle-on";
            let btnText = isFeatured ? "Retirer" : "Mettre en avant";
            let nextStatus = isFeatured ? 0 : 1;
            let activeClass = isFeatured ? "featured-item--active" : "";

            htmlResults += `
            <div class="featured-item ${activeClass}">
                <div>
                    <strong>${m.name}</strong> 
                    <span class="featured-item__meta">(ID Catégorie: ${m.id_category} | Année: ${m.year})</span>
                </div>
                <button class="${btnClass}" onclick="C.handlerToggleFeatured(${m.id}, ${nextStatus})">
                    ${btnText}
                </button>
            </div>`;
          }
          htmlResults += "</div>";
        }

        container.innerHTML = htmlResults;
      };

      C.handlerToggleFeatured = async function(id, status) {
        let res = await DataMovie.setFeatured(id, status);

        V.renderLog(res.message);

        let currentKeyword = document.querySelector("#search-featured").value;
        await C.handlerSearchFeatured(currentKeyword);
      };

      window.V = {};

      V.renderLog = function (txt) {
        let content = document.querySelector("#log");
        content.innerHTML = Log.format(txt);
      };

      V.renderFormMovie = async function (handler) {
        let content = document.querySelector("#movie-form");
        content.innerHTML = await MovieForm.format(handler);
      };

      V.renderFormProfile = async function (hSubmit, hSelect, profiles) {
        let content = document.querySelector("#profile-form");
        content.innerHTML = await ProfileForm.format(hSubmit, hSelect, profiles);
      };

      V.renderFormFeatured = async function (hSearch) {
        let content = document.querySelector("#featured-form-section");
        content.innerHTML = await FeaturedForm.format(hSearch);
      };

      C.start();
    </script>
  </body>
</html>
